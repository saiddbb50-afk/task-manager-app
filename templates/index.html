<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة المهام</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>قائمة المهام اليومية</h2>
        
        <form action="/add" method="POST" class="task-form">
            <input type="text" name="title" placeholder="أضف مهمة جديدة..." required>
            <button type="submit">إضافة</button>
        </form>

        <ul>
            {% for task in tasks %}
                <li>
                    <span>{{ task[1] }}</span>
                    <a href="/delete/{{ task[0] }}" class="delete-btn">حذف</a>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
